# @package paths
# Site catalog: logical dataset key -> path. Copy to <site>.yaml for each machine.
root: ${oc.env:OCEANML3D_DATA,./data}
datasets:
  ssh_l4_duacs_4th:     {path: ssh_l4/SSH_L4_CMEMS_2010-01-01-2024-01-01_4th.nc, source: CMEMS SEALEVEL_GLO_PHY_L4}
  ssh_l4_neurost_4th:   {path: ssh_l4/NeurOST_SSH_2010-2023_4th.nc, source: NeurOST}
  era5_daily_4th:       {path: era5/era5_2010-01-01_2022-01-01_4th.nc, source: ERA5 u10/v10 daily}
  bathy_4th:            {path: bathy/bathymetry_4th.nc, source: GEBCO regridded}
  sst_l4_odyssea_4th:   {path: sst/SST_L4_ODYSSEA_4th.nc}
  drifters_aoml_15m_4th: {path: drifters/daily_uv/drifters_uv_aoml_15m_4th.nc, source: AOML drogued, daily 1/4 deg bins}
  drifters_aoml_00m_4th: {path: drifters/daily_uv/drifters_uv_aoml_00m_4th.nc}
  drifters_cmems_15m_4th: {path: drifters/daily_uv/drifters_uv_cmems_15m_4th.nc}
