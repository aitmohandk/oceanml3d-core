# @package paths
# Site catalog: logical dataset key -> path. Copy to <site>.yaml for each machine.
root: ${oc.env:OCEANML3D_DATA,./data}
datasets:
  ssh_l4_duacs_4th:     {path: ssh_l4/SSH_L4_CMEMS_2010-01-01-2024-01-01_4th.nc, source: CMEMS SEALEVEL_GLO_PHY_L4}
  ssh_l4_neurost_4th:   {path: ssh_l4/NeurOST_SSH_2010-2023_4th.nc, source: NeurOST}
  era5_daily_4th:       {path: era5/era5_2010-01-01_2022-01-01_4th.nc, source: ERA5 u10/v10 daily}
  bathy_4th:            {path: bathy/bathymetry_4th.nc, source: GEBCO regridded}
  sst_l4_odyssea_4th:   {path: sst/SST_L4_ODYSSEA_4th.nc}
  drifters_aoml_15m_4th: {path: drifters/daily_uv/drifters_uv_aoml_15m_4th.nc, source: AOML drogued, daily 1/4 deg bins}
  drifters_aoml_00m_4th: {path: drifters/daily_uv/drifters_uv_aoml_00m_4th.nc}
  drifters_cmems_15m_4th: {path: drifters/daily_uv/drifters_uv_cmems_15m_4th.nc}

  # --- Lorenz-96 through the gridded CLI (config/data/lorenz96.yaml) ---
  lorenz96:             {path: toy/lorenz96.nc, source: scripts/make_toy_data.py}

  # --- OSSE-3D, Gulf Stream (config/data/osse3d_gs21.yaml) ---
  # Truth and statics: produced by the recipes in scripts/prepare/.
  # .zarr: the merge step writes a Zarr store, which is the right format for intermediate data --
  # independent chunk objects, safe to read from threads, unlike NetCDF. open.py dispatches on
  # the extension, so switching back to .nc is a one-character change here and in the recipe.
  glorys_gs_multidepth: {path: glorys/glorys_gs_multidepth_2010-2020.zarr, source: CMEMS GLORYS12 reanalysis}
  glorys_gs_surface:    {path: glorys/glorys_gs_surface_2010-2020.nc, source: CMEMS GLORYS12 reanalysis, surface}
  bathy_gs:             {path: bathy/bathymetry_gs.nc, source: GEBCO on the GLORYS12 grid}
  argo_profiles_gs:     {path: argo/argo_profiles_gs.csv, source: scripts/prepare/argo_profiles.py}
  # Written by `oceanml3d command=prepare-obs`. They have to be declared *before* it runs -- that is
  # how the simulator knows where to put them -- which is why the CLI validates twice: once without
  # the catalog, then prepare-obs, then once with it.
  pseudo_obs_ssh_gs:        {path: osse/pseudo_obs_ssh_gs.nc, source: simulated (oceanml3d command=prepare-obs)}
  pseudo_obs_sst_gs:        {path: osse/pseudo_obs_sst_gs.nc, source: simulated (oceanml3d command=prepare-obs)}
  argo_virtual_thetao_gs21: {path: osse/argo_virtual_thetao_gs21.nc, source: simulated (oceanml3d command=prepare-obs)}
