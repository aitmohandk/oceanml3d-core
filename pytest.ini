[pytest]
testpaths = tests
# `legacy` so the tests of the reserved toy family keep importing its drivers by their bare names
# (`from train import model_factory`) after they moved to legacy/; `.` so a bare `pytest` finds the
# package the same way `python -m pytest` does.
pythonpath = . legacy
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: marks tests as slow (>5s runtime)
    unit: marks unit tests
console_output_style = progress
