# Merge the per-year files written by the job array into the single intermediate store the configs
# read. ${YEAR} and ${NEXT} are the first and last year, exported by `jobs/prepare.sh concat`.
#
# Zarr, not NetCDF, because this is *intermediate* data -- ours to choose the format for, unlike the
# read-only GLORYS mirror upstream and the exported product downstream. A Zarr chunk is an
# independent object with no C-library global state, so reading this back is safe from threads: the
# netCDF thread-safety problem that forces `parallel: false` on the per-year step does not apply
# here, and the training data loader benefits from the same property.
input: ${OCEANML3D_DATA}/by_year/glorys_gs_multidepth_*.nc
output: ${OCEANML3D_DATA}/glorys_gs_multidepth_${YEAR}-${NEXT}.zarr

variables: {thetao: thetao, uo: uo, vo: vo, zos: zos}
keep_depth: true
method: none

# Whole depth and horizontal slabs, 32 days per chunk. On the Gulf Stream box (4018 days, 26 levels,
# 144x144, three 3D variables plus SSH) that is ~504 objects of at most 69 MB, for 26 GB of data.
# Daily chunks would give 16 000 objects -- on Jean Zay, 3% of the project's entire $WORK inode quota
# for one dataset. 256-day chunks give 64 objects of 552 MB, too coarse to read a patch from.
zarr_chunks: {time: 32}

# Safe on the *output* side regardless; the read side stays conservative because the inputs are
# still NetCDF. Once the per-year step also writes .zarr, both can be turned up here.
dask_scheduler: synchronous
