# GLORYS truth for the OSSE-3D Gulf Stream task, read from Datarmor's read-only CMEMS mirror.
#
# No `download:` block on purpose: /home/ref-ocean-reanalysis holds GLORYS12V1 (product 001-030), so
# there is nothing to fetch. Bind that path into the container (jobs/env/datarmor.sh does) or it
# resolves to nothing inside and looks like a missing dataset rather than a missing mount.
#
# ${YEAR} and ${NEXT} are exported by jobs/prepare.sh -- the recipe is read through
# os.path.expandvars, so one file serves every year of the array with no templating step.
#
# The glob anchors ${YEAR} on the VALIDITY date. Mirror files are named
#     mercatorglorys12v1_gl12_mean_<validity YYYYMMDD>_R<production YYYYMMDD>.nc
# and a bare `*${YEAR}*` also matches the production date: `*2020*` caught R2002**0206**, and the
# 2020 job read 415 files spanning 2002-2022.
input: ${GLORYS_SRC}/**/*_mean_${YEAR}????_R*.nc
# Zarr, like every intermediate: only the read side is NetCDF (the mirror, which is not ours).
output: ${OCEANML3D_DATA}/by_year/glorys_gs_multidepth_${YEAR}.zarr
zarr_chunks: {time: 32}   # ~12 chunks per variable and year: 80 inodes per year in Zarr format 2

variables: {thetao: thetao, uo: uo, vo: vo, zos: zos}
time: ["${YEAR}-01-01", "${YEAR}-12-31"]   # inclusive: NEXT-01-01 would belong to two years

domain: {lat: [32, 44], lon: [-66, -54]}   # cut in each file before it is read (~145 x 145 of 2041 x 4320)
max_gb: 20              # a year of this box is ~4.6 GB (50 levels); anything near 20 means the recipe misfired
keep_depth: true        # 3D task: the depth axis is the point

# Target resolution in degrees, NOSC's NOSC_TARGET_RES. Unset -> native 1/12 deg. Set it for the
# whole chain, not one step: `jobs/prepare.sh --res 0.25 ...` or `qsub -v ...,OCEANML3D_TARGET_RES=0.25`.
# The grid is regular, anchored on `domain`, identical for every product prepared with the same pair.
resolution: ${OCEANML3D_TARGET_RES}
method: none            # native grid when `resolution` is unset; bilinear onto it when set

# Deliberately no `depth_indices`: store every level the source carries and let the task select.
# The data config's `depth_index` addresses positions in THIS file, so reducing here silently
# re-points all 21 indices in config/data/osse3d_gs21.yaml. See docs/pipeline_3d.md section 3.3.
