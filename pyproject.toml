[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanml3d-core"
version = "0.1.0"
description = "4DVarNet and flow-matching core for 3D multivariate ocean data assimilation."
readme = "README.md"
requires-python = ">=3.10"
# EUPL-1.2. The upstream material (NOSC, CeCILL-C; 4dvarnet-fm-opencode, no stated terms) was
# relicensed with the rightsholder's permission -- IMT Atlantique / OceaniX holds both. The EUPL
# Appendix lists CeCILL v2.0/v2.1 as compatible, not CeCILL-C, so no compatibility route was
# relied on. See LICENSING.md and NOTICE. The previous `{ text = "MIT" }` was unsupported.
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    # The real window, and it is narrower than it looks: `monai>=1.5,<1.6` below pins
    # torch>=2.4.1,<2.7.0. Declaring `torch>=2.0` let pip silently *downgrade* a newer torch
    # already present in the environment -- and from the default PyPI index, i.e. pulling the
    # ~2.5 GB CUDA wheels. Stated explicitly so resolution fails early and legibly instead.
    "torch>=2.4.1,<2.7",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pytorch-lightning>=2.0",
    # the gridded-ocean half of the tree (catalog, data/open.py, obs/, inference/) is xarray-native
    "xarray>=2023.1",
    "pandas>=2.0",
    "netCDF4>=1.6",
    "dask>=2023.1",
    # `obs/argo_virtual.py` imports `scipy.stats` at module level and `obs/pseudo_obs.py` uses
    # `scipy.ndimage`; both are core, not optional. Undeclared until the first clean-environment CI
    # run, which is exactly the kind of thing only a real install can find.
    "scipy>=1.10",
    # MONAI declares einops optional, but `DiffusionModelUNet` always builds an attention mid-block
    # (`AttnMidBlock` -> `SpatialAttentionBlock` -> `SABlock` -> `einops.layers.torch.Rearrange`),
    # so for this project it is not optional at all. Declared directly rather than via the
    # `monai[einops]` extra, so the requirement stays visible if the trunk ever changes again.
    "einops>=0.6",
    # the default trunk of the gridded models is MONAI's DiffusionModelUNet
    # (`models/ocean/nn/unet_monai.py`). The `<1.6` ceiling is load-bearing: monai 1.6.0 requires
    # torch>=2.8, 1.5.x pins torch>=2.4.1,<2.7.0 and leaves this project's torch alone.
    "monai>=1.5,<1.6",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
# `data/open.py` reads `.zarr` stores and `data/datamodule.py` writes its stacked cache as one;
# NetCDF alone works without it.
zarr = ["zarr>=2.16"]
# only `scripts/prepare/` needs these, and only to *download* — nothing in the package imports them.
prepare = ["copernicusmarine>=1.0", "cdsapi>=0.7", "xesmf>=0.8"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
oceanml3d = "oceanml3d.cli:main"

# The model registry reads this group at import time (`oceanml3d/registry.py`), so third-party models
# register themselves by publishing into it — see `docs/adding_a_model.md`. The group *name* is a
# published contract and is deliberately `oceanml3d.models`, not `oceanml3d.models.ocean`, even
# though the built-in implementations now live one level down.
[project.entry-points."oceanml3d.models"]
nosc_unet = "oceanml3d.models.ocean.nosc.model:NOSCUNet"
fourdvarnet = "oceanml3d.models.ocean.fourdvarnet.model:FourDVarNet"
passthrough = "oceanml3d.models.ocean.baselines.model:Passthrough"
linear = "oceanml3d.models.ocean.baselines.model:LinearBaseline"
climatology = "oceanml3d.models.ocean.baselines.model:Climatology"
optimal_interpolation = "oceanml3d.models.ocean.assimilation.model:OptimalInterpolation"
enkf = "oceanml3d.models.ocean.assimilation.model:EnsembleKalmanFilter"

[tool.setuptools.packages.find]
include = ["oceanml3d*"]

# No `[tool.setuptools.package-data]`: there is not one YAML file under `oceanml3d/`. The prototype
# declared `models/*/config/**/*.yaml`, but that pattern matched nothing there either — the
# convention documented in `docs/adding_a_model.md` step 2 puts a model's defaults in the root
# `config/model/<name>.yaml`, with the rest of the Hydra tree. See the note below.

# NOTE: the Hydra YAML tree (`config/`) and the driver scripts (`legacy/train.py`, `legacy/eval_*.py`,
# ...) are still at the repository root, so they are NOT in the wheel: an installed distribution
# gives you the library, not the CLI. Moving them in is the next step — `@hydra.main(config_path=...)`
# resolves relative to the file that carries the decorator, so it has to move with them.
# `include = ["oceanml3d*"]` does pick up `oceanml3d.legacy`, the reserved toy family
# (`oceanml3d/legacy/README.md`): that is deliberate, so reactivating it is a plain import.

[tool.ruff]
line-length = 120
extend-exclude = ["archive", "logs", "reports", "notebooks"]
force-exclude = true
target-version = "py310"

[tool.ruff.lint]
# The full set that `oceanml3d-eval` runs, now enforced on the live tree. The backlog that made this
# a "target, not a gate" turned out to live almost entirely in reserve code: of 168 violations, 143
# were in `oceanml3d/legacy/` and 2 in `legacy/`, leaving 24 in the code anyone actually runs. Those
# are fixed; the reserve trees are exempted below rather than rewritten.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    # Line length. 67 occurrences in the live tree, all style: fixing them means reflowing scientific
    # code that wraps at its own rhythm, for a diff nobody can review usefully.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Reserve: the toy / Lorenz / QG family and the inherited job scripts. Exempted, not fixed, because
# rewriting imported scientific code to satisfy a style rule is how you introduce a bug into results
# that have already been published. Counts measured 2026-09-15.
#
# One note worth keeping, since it corrects an earlier assessment. `docs/ROADMAP.md` warned that some
# of the 27 B023 "might be real bugs". They are not. All 27 come from two `def closure()` blocks in
# `legacy/evaluation/baselines.py` (lines 630 and 2855), each passed to `opt.step(closure)` inside
# the same loop iteration -- the standard LBFGS idiom. The closure is consumed before the loop
# variable can change, so the late binding is harmless in both cases.
"oceanml3d/legacy/**" = ["B007", "B008", "B023", "B905", "E402", "F841", "UP006", "UP035", "UP045"]
"legacy/**" = ["B007", "B008", "B023", "B905", "E402", "F841", "UP006", "UP035", "UP045"]
