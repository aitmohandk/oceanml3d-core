name: CI

# The default branch of this repository is `main`. An earlier revision of this file, inherited from
# `4dvarnet-fm-opencode`, triggered on `master` and on that repository's topic branches only, so CI
# never ran here -- including on the PR that moved 455 imports into the `oceanml3d` namespace, and
# on the two that switched the default trunk to MONAI and moved the toy family to `legacy/`.
# Keep `main` in both trigger blocks.
on:
  pull_request:
    branches:
      - main
      - 'feat/**'
      - 'agents/**'
  push:
    branches:
      - main
      - 'feat/**'
      - 'agents/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff lint (informational)
    runs-on: ubuntu-latest
    # Non-blocking, and scoped to the Python files this PR/push actually changed, so the measured
    # pre-existing debt elsewhere (168 violations under the target E,F,I,B,UP set -- see the
    # [tool.ruff.lint] comment in pyproject.toml) doesn't fail unrelated PRs. Gate = pytest.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff
      - name: Lint changed Python files
        run: |
          BASE_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.py' 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then
            echo "Linting changed files:"; echo "$CHANGED"
            echo "$CHANGED" | xargs ruff check
          else
            echo "No changed Python files to lint."
          fi

  test:
    name: pytest (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install (CPU torch inside the monai window, then the package itself)
        run: |
          python -m pip install -U pip
          # Two constraints at once. CPU wheels only: the default PyPI torch ships ~2.5 GB of CUDA
          # payload the runner cannot use. And the *upper* bound is not optional -- `monai>=1.5,<1.6`
          # pins torch<2.7, so installing an unbounded torch here would make the next step downgrade
          # it, silently, from the default index, i.e. pulling exactly the CUDA wheels this line avoids.
          pip install 'torch>=2.4.1,<2.7' --index-url https://download.pytorch.org/whl/cpu
          # Installing the package (not a hand-written requirements list) is what exercises the
          # packaging metadata, the console script and the `oceanml3d.models` entry points, and is
          # what brings in the xarray/netCDF4/dask/monai half the gridded tests need.
          pip install -e '.[dev,zarr]'
      - name: Check torch was not silently downgraded or swapped for a CUDA build
        run: |
          python - <<'PY'
          import torch
          v = torch.__version__
          assert "+cu" not in v, f"a CUDA build slipped in: {v}"
          assert tuple(int(x) for x in v.split("+")[0].split(".")[:2]) < (2, 7), f"torch {v} is outside the monai<1.6 window"
          print("torch", v, "ok")
          PY
      - name: Registry smoke check
        run: oceanml3d command=list-models
      - name: Run the whole fast suite
        # The previous revision ran a hand-maintained list of 18 files, none of which touched the
        # gridded (NOSC-derived) half of the tree. Run everything instead; `slow` stays out.
        run: pytest -m "not slow" -q
